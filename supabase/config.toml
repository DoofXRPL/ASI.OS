# Supabase local configuration for ASI OS.
#
# Run `supabase start` to bring up a local stack and `supabase db reset` to
# apply everything in `supabase/migrations/` from scratch.
#
# The RLS test suite does NOT require this stack — it runs against any
# PostgreSQL 14+ database via TEST_DATABASE_URL (see tests/rls/README.md), which
# keeps the required CI gate fast and Docker-free.

project_id = "asi-os"

[db]
port = 54322
shadow_port = 54320
# Must be a version the CLI supports *and* the version the hosted project runs
# (`show server_version;`). The CLI validates this before it starts anything, so a
# number it does not recognise is not a slow local stack but no local stack at
# all: `supabase start`, `db reset`, `db push` and `status` all fail with
# `Failed reading config: Invalid db.major_version`. 16 is not an accepted value —
# on CLI 2.111.0 they are 12, 13, 14, 15 and 17 — so every command in the
# "Getting started" section of the README failed here. 17 is also what the CLI's
# own `init` template now ships. Guarded by tests/unit/supabase-config.test.ts.
major_version = 17

[api]
enabled = true
port = 54321
# `access` is missing from this list on purpose, and must stay missing. The
# early-access queue lives there precisely so PostgREST cannot reach it; adding
# it here would expose the table that public.request_early_access() exists to
# avoid exposing. See supabase/migrations/0003_early_access.sql.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[studio]
enabled = true
port = 54323

# Where mail the local stack sends is caught, so an invite can be read without
# leaving the machine. Renamed upstream from `[inbucket]`, which the CLI still
# accepts and warns about on every command.
[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

# ASI OS is invite-only from the first commit. Public signup stays off here and
# in the hosted project; accounts are created by the owner. This is the real
# access gate — application code is only the second line of defence.
#
# This is the setting that enforces it: it becomes `GOTRUE_DISABLE_SIGNUP=true`,
# which refuses to create an account no matter which provider is asked.
enable_signup = false

[auth.email]
# Whether the email provider exists at all, despite the name: it has mapped to
# `GOTRUE_EXTERNAL_EMAIL_ENABLED` rather than `GOTRUE_DISABLE_SIGNUP`. False
# therefore turns off email sign-*in* as well as sign-up, and the owner — whose
# account is created by hand and who has no other provider — is refused with
# `email_provider_disabled` (supabase/supabase#40582). Invite-only is
# `[auth] enable_signup = false` above with this left true, which is the
# combination the CLI's own template names for it.
# Guarded by tests/unit/supabase-config.test.ts.
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
